# OmniTAK Radio CI — unit tests and emulator-only button navigation.
#
# Scope and known limitations:
#  - The optional emulator job injects platform keys for focus/navigation.
#    It cannot establish XP5900 knob delivery or screen-off GPS/TAK behavior.
#    BLE-dependent paths remain parser/pipeline unit tested only.
#  - app/src/main/jniLibs/ is a ~750 MB untracked local overlay of prebuilt
#    native libs (gitignored, never in the repo). The debug APK built here
#    therefore packages WITHOUT those overlaid .so files — fine for
#    compile/test verification, NOT a release artifact. Release builds with
#    the overlay happen on a workstation that has it (scripts/build-release.sh).
#  - No release signing on CI: keystore.properties is absent, and the
#    release config falls back to debug signing by design. assembleDebug
#    avoids the question entirely.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Humla NDK
        run: sdkmanager --install 'ndk;25.1.8937393'

      # Caches Gradle distribution, dependency caches, and configuration
      # cache between runs; also uploads a build scan-free job summary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  button-ui:
    name: Compact-screen button interactions (emulator)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Humla NDK
        run: sdkmanager --install 'ndk;25.1.8937393'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test radio navigation without touch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash scripts/test-radio-buttons.sh emulator-5554
